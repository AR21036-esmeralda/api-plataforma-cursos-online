spring.application.name=api-cursos-online

# --- PostgreSQL ---
# Los valores se pueden sobreescribir con variables de entorno (DB_URL, DB_USER, DB_PASSWORD)
# NOTA: el script plataforma_cursos_online_db.sql crea la BD con el nombre "plataforma_cursos_online"
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/plataforma_cursos_online}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# --- JPA ---
# La estructura de la BD la crean los scripts SQL, Hibernate solo valida que coincida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# --- Mensajes de error en las respuestas JSON (útil para Postman) ---
# Se puede quitar cuando el manejo global de excepciones (parte 5) devuelva su propio formato
server.error.include-message=always
server.error.include-binding-errors=always
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

server.port=8081
